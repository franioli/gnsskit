# Build, test and publish gnsskit to PyPI when a GitHub release is published.
# Uses PyPI Trusted Publishing: no token is stored; PyPI trusts this workflow
# (configured once on pypi.org -> gnsskit -> Settings -> Publishing, environment "pypi").
name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # needed by Trusted Publishing
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3 # no moving major tag: update the full version

      - name: Check that the tag matches the package version
        run: |
          version="$(uv version --short)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $version in pyproject.toml"
            exit 1
          fi

      - name: Test
        run: uv run pytest

      - name: Build
        run: uv build

      - name: Publish
        run: uv publish
